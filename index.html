<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The To-Do List</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>The To-Do List</h1>
      <div class="task-info">
        <span class="numberOfTasks"></span>
        <button class="clear-btn"><i class="fas fa-trash"></i> Clear All</button>
        <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
      </div>
    </header>

    <main>
      <div id="taskList" class="task-list"></div>
    </main>

    <footer>
      <input id="userInput" type="text" placeholder="Add a new task..." required />
      <button id="add" class="add-btn"><i class="fas fa-plus"></i></button>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="node_modules/sortablejs/Sortable.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
